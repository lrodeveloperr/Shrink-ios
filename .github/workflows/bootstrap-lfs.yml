name: Bootstrap reviewed source with Git LFS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download reviewed source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_url="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.tag_name == "lfs-bootstrap-c1dd3f2") | .assets[] | select(.name == "Shrink-iOS-current-c1dd3f2.zip") | .url' | head -n 1)"
          test -n "$asset_url"
          gh api -H "Accept: application/octet-stream" "$asset_url" > /tmp/Shrink-iOS-current-c1dd3f2.zip
          echo "6870b5cff5d28fbf16ac755549fb2f6a1fe36b75decdba8f51cedda2ba01b65f  /tmp/Shrink-iOS-current-c1dd3f2.zip" | sha256sum -c -

      - name: Replace obsolete source tree
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          unzip -q /tmp/Shrink-iOS-current-c1dd3f2.zip -d "$work"
          test "$(git -C "$work/Shrink-ios" rev-parse HEAD 2>/dev/null || true)" = "" || true
          rsync -a --delete --exclude='.git/' "$work/Shrink-ios/" ./
          echo "255468433a3b986e2d5e7c85dd02f029cae83401128a8496280459fb39f21cee  App/Resources/catalogue.sqlite3" | sha256sum -c -

      - name: Track catalogue with Git LFS
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs track "App/Resources/catalogue.sqlite3"
          git add .gitattributes
          git add -A

      - name: Validate reconstructed source
        run: |
          set -euo pipefail
          python3 Scripts/check_localizations.py
          python3 Scripts/validate_release.py --sample-ads
          python3 Scripts/validate_catalogue.py App/Resources/catalogue.sqlite3 --database-only
          git diff --cached --check

      - name: Commit and push reviewed source
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git commit -m "Reconstruct reviewed Shrink iOS source"
          git push origin HEAD:main
